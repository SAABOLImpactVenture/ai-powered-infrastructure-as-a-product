name: Modern accelerator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate modern accelerator boundary
        run: ./scripts/validate-modern-accelerator.sh
      - name: Validate JSON evidence
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('validated', p)
          PY
      - name: Validate phase manifests
        run: |
          set -euo pipefail
          manifests=(
            artifacts/phase-23/MANIFEST.sha256
            artifacts/phase-24/MANIFEST.sha256
          )
          expected="$(printf '%s\n' "${manifests[@]}" | sort)"
          actual="$(find artifacts -type f -name MANIFEST.sha256 -print | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Phase manifest set is missing, renamed, or unregistered."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest"
            sha256sum --check "$manifest"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
