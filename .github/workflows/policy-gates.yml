name: policy-gates

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify policy source parses
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v0.64.1

      - name: OPA check maintained policy trees
        run: |
          set -euo pipefail
          opa check policy/conftest
          opa check policies/opa

      - name: Conftest maintained Terraform plan fixture
        run: |
          set -euo pipefail
          test -f policy/conftest/sample-plan.json
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.64.0 \
            test --policy policy/conftest policy/conftest/sample-plan.json

      - name: Explain split controls
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Policy gate scope
          - Policy source syntax and the maintained Conftest contract are blocking here.
          - Terraform validation and Checkov/TFLint run in dedicated IaC workflows.
          - Gitleaks runs in the canonical `gitleaks` workflow with a detector canary.
          - Broad legacy Kubernetes inventories are not revalidated on unrelated pull requests.
          EOF
