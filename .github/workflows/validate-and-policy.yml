name: legacy product Terraform validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - path: products/network-azure/infra
          - path: products/network-aws/infra
          - path: products/network-gcp/infra
          - path: products/network-oci/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform validate preserved product module
        working-directory: ${{ matrix.product.path }}
        run: |
          terraform init -input=false -backend=false
          terraform validate -no-color

      - name: Policy ownership note
        run: echo "Current policy behavior is evaluated by the canonical policy-gates workflow."
