name: Hybrid Persona Framework Validation

on:
  push:
    branches: [main, trunk]
    paths:
      - 'docs/personas/**'
      - 'skills/semantic-kernel/python/**'
      - 'artifacts/evidence/oscal/**'
      - '.github/workflows/ci-persona-hybrid-validate.yml'
  pull_request:
    branches: [main, trunk]
    paths:
      - 'docs/personas/**'
      - 'skills/semantic-kernel/python/**'
      - 'artifacts/evidence/oscal/**'
      - '.github/workflows/ci-persona-hybrid-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate framework JSON using BOM-tolerant UTF-8
        run: |
          python - << 'EOF'
          import json
          from pathlib import Path

          roots = [Path('docs/personas'), Path('skills/semantic-kernel/python'), Path('artifacts/evidence/oscal')]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  with path.open('r', encoding='utf-8-sig') as f:
                      json.load(f)
                  print(f'validated {path}')
          EOF

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform fmt and validate when persona IaC exists
        run: |
          if [ -d "iac/modules/secure-storage" ]; then
            terraform -chdir=iac/modules/secure-storage init -backend=false -input=false
            terraform -chdir=iac/modules/secure-storage validate -no-color
          else
            echo "iac/modules/secure-storage not present; no persona-specific Terraform to validate."
          fi

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: skills/semantic-kernel/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: skills/semantic-kernel/python
        run: pytest -q

  oscal-verify:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
      - name: Verify OSCAL documents if present
        run: |
          python - << 'EOF'
          import json
          from pathlib import Path
          from jsonschema import validate

          schema = {"type": "object"}
          base = Path("artifacts/evidence/oscal")
          if not base.is_dir():
              print("No OSCAL documents present; skipping.")
          else:
              for path in base.glob("*.json"):
                  with path.open("r", encoding="utf-8-sig") as f:
                      doc = json.load(f)
                  validate(instance=doc, schema=schema)
                  print(f"Validated OSCAL JSON document: {path}")
          EOF

  evidence-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence summary
        run: |
          if [ -d "artifacts/evidence" ]; then
            echo "Evidence files:"
            find artifacts/evidence -type f -print || true
          else
            echo "No evidence directory yet."
          fi
