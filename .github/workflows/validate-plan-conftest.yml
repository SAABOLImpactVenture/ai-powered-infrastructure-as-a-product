name: legacy product plan preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate-and-plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product:
          - name: azure
            path: products/network-azure/infra
          - name: aws
            path: products/network-aws/infra
          - name: gcp
            path: products/network-gcp/infra
          - name: oci
            path: products/network-oci/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: ${{ matrix.product.path }}
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.product.path }}
        run: terraform validate -no-color

      - name: Terraform Plan Preview
        working-directory: ${{ matrix.product.path }}
        env:
          TF_VAR_resource_group_name: rg-ci
          TF_VAR_vnet_name: vnet-ci
          TF_VAR_location: eastus
          TF_VAR_region: us-east-1
          TF_VAR_project: ci-project
          TF_VAR_compartment_ocid: ocid1.compartment.oc1..aaaaexample
        run: |
          set +e
          terraform plan -input=false -refresh=false -lock=false -out=tfplan
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            terraform show -json tfplan > plan.json
          else
            printf '%s\n' '{"preview":"plan unavailable without provider identity or additional inputs"}' > plan.json
          fi

      - name: Upload plan preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.product.name }}
          path: ${{ matrix.product.path }}/plan.json

      - name: Policy ownership note
        run: echo "Current policy behavior is evaluated by the canonical policy-gates workflow."
