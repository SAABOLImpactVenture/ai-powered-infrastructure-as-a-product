name: python-secure

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bandit-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare reports directory
        run: mkdir -p reports/pip-audit

      - name: Install pinned security tools
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit==1.9.4' 'pip-audit==2.10.1'

      - name: Collect full Bandit evidence
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          for path in scripts servers services skills; do
            [ -d "$path" ] && targets+=("$path")
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No maintained Python source directories found."
            printf '%s\n' '{"results": []}' > reports/bandit.json
          else
            bandit -r "${targets[@]}" -f json -o reports/bandit.json || true
          fi

      - name: Block on medium/high Bandit findings
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          for path in scripts servers services skills; do
            [ -d "$path" ] && targets+=("$path")
          done

          if [ "${#targets[@]}" -gt 0 ]; then
            bandit -r "${targets[@]}" -ll
          fi

      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-evidence
          path: reports/bandit.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit repository Python dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find . -type f \( -name 'requirements.txt' -o -name 'requirements-*.txt' \) \
            -not -path './.git/*' -not -path './.venv/*' -not -path './venv/*' | sort)

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No repository Python requirements manifests found."
            printf '%s\n' '{"manifests": []}' > reports/pip-audit/summary.json
            exit 0
          fi

          failures=0
          printf '%s\n' '{"manifests": [' > reports/pip-audit/summary.json
          first=true
          for manifest in "${manifests[@]}"; do
            safe_name="$(printf '%s' "${manifest#./}" | tr '/ ' '__')"
            report="reports/pip-audit/${safe_name}.json"
            echo "== pip-audit: $manifest =="

            set +e
            pip-audit -r "$manifest" -f json -o "$report"
            rc=$?
            set -e

            if [ "$first" = false ]; then printf ',\n' >> reports/pip-audit/summary.json; fi
            first=false
            jq -n --arg manifest "${manifest#./}" --argjson exit_code "$rc" \
              '{manifest: $manifest, exit_code: $exit_code}' >> reports/pip-audit/summary.json

            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          printf '\n]}\n' >> reports/pip-audit/summary.json

          if [ "$failures" -ne 0 ]; then
            echo "$failures repository dependency manifest(s) contain audit findings or could not be audited."
            exit 1
          fi

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit
          if-no-files-found: error
          retention-days: 14
