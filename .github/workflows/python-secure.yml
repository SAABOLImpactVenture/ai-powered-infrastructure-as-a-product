name: python-secure

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bandit-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Install pinned security tools
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit==1.9.4' 'pip-audit==2.10.1'

      - name: Collect full Bandit evidence
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          for path in scripts servers services skills; do
            [ -d "$path" ] && targets+=("$path")
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No maintained Python source directories found."
            printf '%s\n' '{"results": []}' > reports/bandit.json
          else
            bandit -r "${targets[@]}" -f json -o reports/bandit.json || true
          fi

      - name: Block on medium/high Bandit findings
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          for path in scripts servers services skills; do
            [ -d "$path" ] && targets+=("$path")
          done

          if [ "${#targets[@]}" -gt 0 ]; then
            bandit -r "${targets[@]}" -ll
          fi

      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-evidence
          path: reports/bandit.json
          if-no-files-found: error
          retention-days: 14

      - name: pip-audit root dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f json -o reports/pip-audit.json
          elif [ -f pyproject.toml ]; then
            pip-audit -f json -o reports/pip-audit.json
          else
            echo "No root Python dependency manifest found."
            printf '%s\n' '[]' > reports/pip-audit.json
          fi

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit.json
          if-no-files-found: error
          retention-days: 14
