name: terraform-docs

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  render-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned terraform-docs tool
        run: |
          docker run --rm quay.io/terraform-docs/terraform-docs:0.19.0 --version

      - name: Render documentation for changed Terraform modules
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            mapfile -t dirs < <(
              git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.tf' \
                | xargs -r -n1 dirname \
                | sort -u
            )
          else
            mapfile -t dirs < <(
              git ls-files '*.tf' \
                | xargs -r -n1 dirname \
                | sort -u
            )
          fi

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No Terraform modules to render."
            exit 0
          fi

          mkdir -p terraform-docs-output
          for dir in "${dirs[@]}"; do
            [ -d "$dir" ] || continue
            safe_name="$(printf '%s' "$dir" | tr '/ ' '__')"
            echo "== terraform-docs: $dir =="
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace:ro" \
              -w "/workspace/$dir" \
              quay.io/terraform-docs/terraform-docs:0.19.0 \
              markdown table . > "terraform-docs-output/${safe_name}.md"
          done

      - name: Upload rendered documentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-docs-render
          path: terraform-docs-output
          if-no-files-found: ignore
          retention-days: 7
