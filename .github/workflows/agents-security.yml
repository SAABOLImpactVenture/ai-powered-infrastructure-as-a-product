name: Agents Security & Evidence

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa-and-evals:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v0.64.1

      - name: Validate agent policy source
        run: |
          set -euo pipefail
          opa check policies/opa

      - name: Prove destructive action is denied
        run: |
          set -euo pipefail
          opa eval --format=json \
            -i tests/agents-evals/tool-abuse/danger-verb-without-approval.json \
            -d policies/opa \
            'data.agents.actions.deny' > danger-deny.json

          jq -e '.result[0].expressions[0].value | type == "array" and length > 0' danger-deny.json >/dev/null
          jq -e '.result[0].expressions[0].value | any(. == "Danger verb '\''delete'\'' requires human approval")' danger-deny.json >/dev/null
          echo "Destructive action was denied as expected."

      - name: Prove metadata-target SSRF is denied
        run: |
          set -euo pipefail
          opa eval --format=json \
            -i tests/agents-evals/ssrf/url-compose.json \
            -d policies/opa \
            'data.agents.ssrf.deny' > ssrf-deny.json

          jq -e '.result[0].expressions[0].value | type == "array" and length > 0' ssrf-deny.json >/dev/null
          jq -e '.result[0].expressions[0].value | any(contains("metadata"))' ssrf-deny.json >/dev/null
          echo "Metadata-target SSRF attempt was denied as expected."

      - name: Detect forbidden HTML/MD in pre-ingest samples
        run: |
          set -euo pipefail
          if grep -E -i '<script|on[a-z]+\=|data:' tests/agents-evals/prompt-injection/hidden-html.md; then
            echo "Injection indicators present as expected (test corpus)"
          else
            echo "Prompt-injection fixture no longer contains the expected indicators."
            exit 1
          fi

      - name: Upload policy evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-policy-evals
          path: |
            danger-deny.json
            ssrf-deny.json
          retention-days: 14

  cosign-sbom-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain preserved external evidence lane
        run: |
          echo "This job is a preserved V1 external-image evidence pattern."
          echo "Replace placeholder image identities and provide published SBOMs before treating it as an operational gate."

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Verify MCP tool images and capture evidence
        run: |
          set -e
          mkdir -p governance/cato-evidence/cosign
          cosign verify ghcr.io/yourorg/mcp-tool-jira@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa | tee governance/cato-evidence/cosign/jira.txt
          cosign verify ghcr.io/yourorg/egress-allowlist-proxy@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb | tee governance/cato-evidence/cosign/egress-proxy.txt

      - name: Collect SBOMs
        run: |
          set -e
          mkdir -p governance/cato-evidence/sbom
          test -f governance/cato-evidence/sbom/mcp-tool-jira.spdx.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cato-evidence
          path: governance/cato-evidence
