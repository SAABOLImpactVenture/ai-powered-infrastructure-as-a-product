name: oscal-check (legacy manual compatibility)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OSCAL generator source
        run: |
          test -f scripts/oscal/sarif_to_oscal.py
          python3 -m py_compile scripts/oscal/sarif_to_oscal.py
          echo "Generated assessment-results are validated in evidence-oscal-pipeline; they are not expected to be committed to the source tree."
