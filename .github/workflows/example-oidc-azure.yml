name: example-oidc-azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-log-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform validate preserved Log Analytics module
        working-directory: platform/azure/observability/log_analytics
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
