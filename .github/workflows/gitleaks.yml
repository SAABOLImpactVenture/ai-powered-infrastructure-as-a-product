name: gitleaks

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secret detector with canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-canary
          printf '%s\n' 'GITHUB_TOKEN=ghp_012345678901234567890123456789012345' > /tmp/gitleaks-canary/canary.txt

          set +e
          docker run --rm \
            -v /tmp/gitleaks-canary:/scan:ro \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --no-git --source /scan --no-banner --redact >/dev/null 2>&1
          rc=$?
          set -e

          if [ "$rc" -ne 1 ]; then
            echo "Gitleaks canary was not detected as expected (exit=$rc)."
            exit 1
          fi
          echo "Gitleaks canary detected successfully."

      - name: Scan repository history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --source /repo \
              --no-banner \
              --redact \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 7
