name: trivy-scan-distroless

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mcp-azure, dockerfile: servers/mcp/azure/Dockerfile.distroless, context: servers/mcp/azure }
          - { name: mcp-policy-azure, dockerfile: servers/mcp-policy/azure/Dockerfile.distroless, context: servers/mcp-policy/azure }
          - { name: mcp-aws, dockerfile: servers/mcp/aws/Dockerfile.distroless, context: servers/mcp/aws }
          - { name: mcp-policy-aws, dockerfile: servers/mcp-policy/aws/Dockerfile.distroless, context: servers/mcp-policy/aws }
          - { name: mcp-gcp, dockerfile: servers/mcp/gcp/Dockerfile.distroless, context: servers/mcp/gcp }
          - { name: mcp-policy-gcp, dockerfile: servers/mcp-policy/gcp/Dockerfile.distroless, context: servers/mcp-policy/gcp }
          - { name: mcp-oci, dockerfile: servers/mcp/oci/Dockerfile.distroless, context: servers/mcp/oci }
          - { name: mcp-policy-oci, dockerfile: servers/mcp-policy/oci/Dockerfile.distroless, context: servers/mcp-policy/oci }
    steps:
      - uses: actions/checkout@v4

      - name: Build image locally
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "iaap-${{ matrix.name }}:${{ github.sha }}" \
            "${{ matrix.context }}"

      - name: Scan image with Trivy (report-only baseline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "iaap-${{ matrix.name }}:${{ github.sha }}"
          format: sarif
          output: "trivy-${{ matrix.name }}.sarif"
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-${{ matrix.name }}.sarif"
          category: "distroless-${{ matrix.name }}"
