name: legacy nested docs preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt
      - name: Build legacy nested site
        working-directory: docs/site
        run: mkdocs build --clean
      - name: Upload legacy preview
        uses: actions/upload-artifact@v4
        with:
          name: legacy-nested-docs-preview
          path: docs/site/site
          retention-days: 7
