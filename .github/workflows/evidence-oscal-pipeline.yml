name: evidence-oscal-pipeline

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - name: Terraform init and validate (read-only mode)
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color || true
      - name: Terraform plan (JSON)
        run: |
          terraform init -input=false
          terraform plan -out=tfplan.bin -input=false -lock=false -detailed-exitcode || true
          terraform show -json tfplan.bin > tfplan.json
      - uses: actions/upload-artifact@v4
        with: { name: tfplan, path: tfplan.json }

  policy:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tfplan, path: . }
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.53.0 }
      - name: tflint
        run: |
          tflint --init
          tflint -f compact
      - name: Checkov (TF/K8s/Helm) SARIF
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
          framework: terraform,kubernetes,helm
          output_format: sarif
          output_file_path: checkov.sarif
      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: checkov.sarif }
      - name: OPA on plan (deny on violations)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.64.0 \
            test --policy policy/ tfplan.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with: { name: sarif, path: checkov.sarif }

  oscal:
    runs-on: ubuntu-latest
    needs: [plan, policy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tfplan, path: . }
      - uses: actions/download-artifact@v4
        with: { name: sarif, path: . }
      - name: Build OSCAL assessment-results from SARIF and plan evidence
        run: |
          mkdir -p artifacts/oscal
          python3 scripts/oscal/sarif_to_oscal.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --sarif checkov.sarif \
            --plan tfplan.json \
            --out artifacts/oscal/assessment-results.json
      - name: Validate generated OSCAL contract
        run: |
          test -s artifacts/oscal/assessment-results.json
          jq -e '.["assessment-results"]' artifacts/oscal/assessment-results.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: oscal-results
          path: artifacts/oscal/assessment-results.json

  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: oscal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oscal-results
          path: artifacts/oscal
      - name: Login to Azure (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to immutable evidence store
        env:
          STORAGE_ACCOUNT: ${{ secrets.EVIDENCE_SA }}
          CONTAINER: ${{ secrets.EVIDENCE_CONTAINER }}
        run: |
          set -euo pipefail
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "assessment-results/${{ github.run_id }}.json" \
            --file artifacts/oscal/assessment-results.json \
            --auth-mode login
          az storage blob immutability-policy set \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "assessment-results/${{ github.run_id }}.json" \
            --period 365d \
            --allow-protected-append-writes true
