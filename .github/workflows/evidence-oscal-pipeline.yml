name: evidence-oscal-pipeline

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deterministic SARIF input fixture
        run: |
          mkdir -p reports artifacts/oscal
          cat > reports/ci-fixture.sarif <<'JSON'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {"driver": {"name": "iaap-ci-fixture"}},
                "results": []
              }
            ]
          }
          JSON

      - name: Generate POA&M-style evidence with repository generator
        run: |
          python3 scripts/oscal/sarif_to_oscal.py reports artifacts/oscal/poam.json

      - name: Validate generated evidence contract
        run: |
          set -euo pipefail
          test -s artifacts/oscal/poam.json
          jq -e '.metadata and (.items | type == "array")' artifacts/oscal/poam.json >/dev/null

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: oscal-evidence
          path: artifacts/oscal/poam.json
          retention-days: 14

  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oscal-evidence
          path: artifacts/oscal

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to immutable evidence store
        env:
          STORAGE_ACCOUNT: ${{ secrets.EVIDENCE_SA }}
          CONTAINER: ${{ secrets.EVIDENCE_CONTAINER }}
        run: |
          set -euo pipefail
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "poam/${{ github.run_id }}.json" \
            --file artifacts/oscal/poam.json \
            --auth-mode login
          az storage blob immutability-policy set \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "poam/${{ github.run_id }}.json" \
            --period 365d \
            --allow-protected-append-writes true
