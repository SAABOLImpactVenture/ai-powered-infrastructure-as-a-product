name: validate / iac-gates

on:
  pull_request:
    branches: [ "**" ]
    paths:
      - "products/**"
      - "modules/**"
      - "policy/**"
      - ".github/workflows/ci-matrix-iac-gates.yml"

permissions:
  contents: read

concurrency: iac-gates-${{ github.ref }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      any_tf: ${{ steps.scan.outputs.any_tf }}
      dirs: ${{ steps.scan.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed Terraform directories
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" | tr -d '\r')"

          declare -A SEEN
          DIRS=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            d="${f%/*}"
            [ -d "$d" ] || continue
            if compgen -G "$d/*.tf" >/dev/null; then
              if [ -z "${SEEN[$d]+x}" ]; then
                SEEN[$d]=1
                DIRS+=("$d")
              fi
            fi
          done <<< "$CHANGED"

          if [ "${#DIRS[@]}" -gt 0 ]; then
            echo "any_tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_tf=false" >> "$GITHUB_OUTPUT"
          fi

          printf '%s\n' "${DIRS[@]}" | jq -R -s -c 'split("\n")[:-1]' > dirs.json
          echo "dirs=$(cat dirs.json)" >> "$GITHUB_OUTPUT"
          cat dirs.json

  terraform-validate:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any_tf == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Validate changed Terraform directories without backends or cloud identity
        shell: bash
        run: |
          set -euo pipefail
          for dir in $(jq -r '.[]' <<< '${{ needs.detect.outputs.dirs }}'); do
            echo "== Terraform validate: $dir =="
            (
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate -no-color
            )
          done

  tflint:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any_tf == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: Run TFLint on changed directories
        shell: bash
        run: |
          set -euo pipefail
          for dir in $(jq -r '.[]' <<< '${{ needs.detect.outputs.dirs }}'); do
            echo "== TFLint: $dir =="
            (
              cd "$dir"
              tflint --init
              tflint
            )
          done

  tfsec:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any_tf == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install tfsec
        run: curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - name: Scan changed directories and retain findings as evidence
        shell: bash
        run: |
          set -euo pipefail
          for dir in $(jq -r '.[]' <<< '${{ needs.detect.outputs.dirs }}'); do
            echo "== tfsec: $dir =="
            (cd "$dir" && tfsec || true)
          done

  policy-owner:
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - run: echo "Deterministic policy behavior is owned by the canonical policy-gates workflow; this changed-file workflow does not acquire cloud credentials or generate provider-backed plans."
