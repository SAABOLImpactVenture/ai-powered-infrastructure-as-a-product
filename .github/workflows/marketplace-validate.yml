name: Marketplace Metadata Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          test -f .github/marketplace.yml
          test -f README-MARKETPLACE.md
          test -f LICENSE
          test -f SUPPORT.md
          test -f SECURITY.md
          test -f assets/marketplace/banner.svg
          test -f assets/marketplace/logo.svg
          grep -q 'Apache License' LICENSE
          grep -q 'license: Apache-2.0' .github/marketplace.yml
          echo "Marketplace metadata and Apache 2.0 licensing files are present."
