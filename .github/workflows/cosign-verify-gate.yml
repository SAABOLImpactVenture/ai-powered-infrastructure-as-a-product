name: cosign-verify-gate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - mcp-azure
          - mcp-policy-azure
          - mcp-aws
          - mcp-policy-aws
          - mcp-gcp
          - mcp-policy-gcp
          - mcp-oci
          - mcp-policy-oci
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.2.4'
      - name: Verify signed published image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMG="ghcr.io/saabolimpactventure/ai-powered-infrastructure-as-a-product:${{ matrix.name }}-latest"
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.+" \
            "$IMG"
