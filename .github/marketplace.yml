name: AI-Powered Infrastructure as a Product
short_description: Modern multi-cloud IaaP reference architecture using Crossplane, bounded composite AI, GitHub governance, and evidence.
long_description: |
  IaaS is what we buy; infrastructure-as-a-product is what we build.

  This repository is the program front door for a modern product-control-plane architecture.
  Runtime implementation is deliberately decomposed across bounded Crossplane, product, composite-AI,
  and integration POCs. Historical Terraform, Arc, Backstage, and execution-MCP implementations are
  preserved in Git history rather than maintained as dependencies of the current accelerator.
