# Marketplace listing metadata
name: AI-Powered Infrastructure as a Product
short_description: Product-led multi-cloud foundation architecture using Crossplane, bounded composite AI, GitHub governance, and replaceable execution.
long_description: |
  AI-Powered Infrastructure as a Product is a program-level accelerator and reference architecture
  built around the mental model: IaaS is what we buy; infrastructure-as-a-product is what we build.

  The current architecture uses stable infrastructure-product contracts, a minimal trusted Crossplane
  seed, bounded composite AI for request/review/operations/evidence, deterministic policy, human
  approval, and cloud-native enforcement. Existing Terraform, Azure Arc, Backstage, observability,
  policy, and OSCAL assets are preserved as optional implementation patterns rather than deleted.

  Related bounded POC repositories demonstrate the seed, CloudFoundationEnvironment product,
  composite-AI authority boundary, and credential-free integrated acceptance flow.
