repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.281
    hooks:
      - id: checkov
        args: ["-d", ".", "--quiet"]

# TFLint remains a dedicated CI concern. The upstream TFLint repository no
# longer exposes a pre-commit hook manifest, so keeping it here makes every
# pre-commit run fail before repository files are evaluated.
