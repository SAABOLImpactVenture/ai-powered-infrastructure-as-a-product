repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # GitHub Actions expressions can be valid workflow syntax while generic
        # PyYAML rejects legacy flow mappings containing `${{ ... }}`. GitHub
        # validates workflow syntax; pre-commit validates the rest of the repo.
        exclude: ^\.github/(workflows/.*|[^/]+\.ya?ml)$
      - id: check-json

# IaC security and policy tools remain dedicated CI concerns. Checkov, TFLint,
# Conftest, Trivy, and related gates are run by their purpose-built workflows
# rather than duplicated inside developer pre-commit bootstrap.
