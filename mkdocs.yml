site_name: AI-Powered Infrastructure as a Product
site_url: https://saabolimpactventure.github.io/ai-powered-infrastructure-as-a-product/
repo_url: https://github.com/SAABOLImpactVenture/ai-powered-infrastructure-as-a-product
repo_name: SAABOLImpactVenture/ai-powered-infrastructure-as-a-product
site_description: IaaS is what we buy; infrastructure-as-a-product is what we build.
site_dir: generated-site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Home: index.md
  - Thesis: THESIS.md
  - Product Control Plane: architecture/product-control-plane.md
  - Operating Model: OPERATING-MODEL.md
  - POC Portfolio: poc-portfolio.md
  - Evidence Baseline: poc-baselines/2026-08-07-credential-free-multicloud-foundation.md
  - Interoperability: INTEROPERABILITY.md
  - TFE Investment: TFE-INVESTMENT.md
  - Supersession: SUPERSESSION.md
