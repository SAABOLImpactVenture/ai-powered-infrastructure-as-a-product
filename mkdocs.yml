site_name: AI-Powered Infrastructure as a Product
site_url: https://saabolimpactventure.github.io/ai-powered-infrastructure-as-a-product/
repo_url: https://github.com/SAABOLImpactVenture/ai-powered-infrastructure-as-a-product
repo_name: SAABOLImpactVenture/ai-powered-infrastructure-as-a-product
site_description: IaaS is what we buy; infrastructure-as-a-product is what we build.
site_dir: generated-site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Home: index.md
  - Thesis: THESIS.md
  - POC Portfolio: poc-portfolio.md
  - Architecture:
      - Product Control Plane: architecture/product-control-plane.md
      - Preserved V1 Arc and Terraform Pattern: architecture/v1-azure-arc-terraform-pattern.md
      - Original Azure Control-Plane Architecture: architecture/target-architecture.md
  - Existing Reference Material:
      - Azure Arc: AZURE-ARC.md
      - Agent Operating Model: agents/operating-model.md
      - Agent Workflows: agents/agent-workflows.md
      - Team and Personas: personas/team.md
