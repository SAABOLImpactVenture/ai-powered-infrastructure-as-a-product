apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: dataenvironments.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: DataEnvironment
    plural: dataenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cloud, region, costCenter]
              properties:
                cloud:
                  type: string
                region:
                  type: string
                costCenter:
                  type: string
